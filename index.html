<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1012">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fixar · Central de Operações</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1012;--bg-2:#131417;--surface:#17181b;--surface-2:#1e1f23;--surface-3:#27282d;
  --border:#2b2c31;--border-2:#3b3c42;--ink:#ececee;--ink-2:#abadb4;--muted:#7d7f87;
  --marca:#C2231D;--marca-2:#d8342d;--accent:#c9ccd3;
  --good:#2fa572;--warn:#d39a1e;--crit:#e0484d;
  --s1:#5b8dd6;--s2:#d0683a;--s3:#2fa572;--s4:#c99a2e;--s5:#c95b86;--s6:#8c84d8;
  --r:4px;--r-sm:3px;--shadow:0 6px 20px rgba(0,0,0,.35);
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
input,select,textarea{background:var(--bg);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:8px 10px;outline:none;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{border-color:var(--ink-2)}
input::placeholder,textarea::placeholder{color:var(--muted)}
select option{background:#1b1b1d;color:#f2f2f2}
label{display:block;font-size:12px;font-weight:500;color:var(--ink-2);margin:0 0 5px}
.hide{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:var(--r-sm);border:1px solid var(--border-2);background:var(--surface-2);font-weight:500;font-size:13px;white-space:nowrap;color:var(--ink)}
.btn:hover{background:var(--surface-3);border-color:#4a4b52}
.btn.pri{background:var(--marca);border-color:var(--marca);color:#fff;font-weight:600}
.btn.pri:hover{background:var(--marca-2);border-color:var(--marca-2)}
.btn.blue{background:var(--ink);border-color:var(--ink);color:#111;font-weight:600}
.btn.blue:hover{background:#fff}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}
.btn .ic{width:15px;height:15px}
.ic{width:18px;height:18px;flex:none}

/* ---------------- abertura (curta e discreta) ---------------- */
#intro{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:opacity .3s ease,visibility .3s}
#intro.fora{opacity:0;visibility:hidden}
#intro .riscos{display:none}
#intro .centro{display:grid;justify-items:center;gap:14px}
#intro .tile{width:72px;height:72px;border-radius:6px;background:#fff;display:grid;place-items:center}
#intro .tile img{width:62px;height:62px}
#intro .nome{font-weight:600;font-size:14px;letter-spacing:2px;color:var(--ink-2)}
#intro .nome span{display:inline}
#intro .barra{width:120px;height:2px;background:var(--surface-3);overflow:hidden}
#intro .barra i{display:block;height:100%;width:0;background:var(--marca);animation:carrega 1s linear forwards}
@keyframes carrega{to{width:100%}}
#intro .pular{position:absolute;bottom:20px;right:20px;font-size:12px;color:var(--muted);background:none;border:0}

/* ---------------- login ---------------- */
#login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg)}
.fundo{display:none}
.card-login{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-top:3px solid var(--marca);border-radius:var(--r);padding:28px}
.marca{display:flex;align-items:center;gap:11px}
.marca img{width:40px;height:40px;border-radius:4px;background:#fff}
.marca b{display:block;font-weight:700;font-size:14px;letter-spacing:.4px}
.marca small{display:block;font-size:11px;color:var(--muted)}
.saud{margin:22px 0 18px;padding-top:18px;border-top:1px solid var(--border)}
.saud .dia{font-size:12px;color:var(--muted)}
.saud .dia .pt{display:none}
.saud h1{font-size:20px;line-height:1.25;margin:4px 0 0;font-weight:600}
.msg-dia{margin-top:10px;padding:2px 0 2px 10px;border-left:2px solid var(--marca);font-size:13px;color:var(--ink-2);line-height:1.5}
.msg-dia .emo{display:none}
.campo{margin-bottom:14px;position:relative}
.campo .in{position:relative}
.campo .in>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);width:16px;height:16px}
.campo .in input{padding-left:36px;padding-right:40px;height:42px}
.campo .olho{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:6px}
.lembrar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);margin:4px 0 18px;font-weight:400}
.lembrar input{width:16px;height:16px;accent-color:var(--marca)}
.entrar{width:100%;height:42px;font-size:14px}
.erro{display:flex;gap:8px;align-items:flex-start;background:color-mix(in srgb,var(--crit) 10%,transparent);border:1px solid color-mix(in srgb,var(--crit) 35%,transparent);color:#ffd0d0;padding:9px 11px;border-radius:var(--r-sm);font-size:13px;margin-bottom:14px}
.demo-tip{margin-top:16px;padding-top:14px;border-top:1px solid var(--border);font-size:12px;color:var(--muted);text-align:center}
.demo-tip button{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:3px 9px;margin:3px 2px;font-size:12px;color:var(--ink-2)}
.demo-tip button:hover{color:var(--ink);border-color:var(--border-2)}

/* ---------------- transição após o login ---------------- */
#bemvindo{position:fixed;inset:0;z-index:90;background:var(--bg);display:grid;place-items:center;text-align:center;padding:20px;transition:opacity .25s,visibility .25s}
#bemvindo.fora{opacity:0;visibility:hidden}
#bemvindo .oi{display:none}
#bemvindo h2{font-size:20px;margin:0 0 6px;font-weight:600}
#bemvindo p{color:var(--ink-2);max-width:440px;margin:0 auto;font-size:13px}
#bemvindo .setor{display:inline-block;margin-top:14px;padding:3px 10px;border:1px solid var(--border-2);border-radius:var(--r-sm);font-size:12px;color:var(--ink-2)}

/* ---------------- estrutura ---------------- */
#app{min-height:100vh;display:grid;grid-template-columns:232px minmax(0,1fr)}
.lado{position:sticky;top:0;height:100vh;overflow:auto;background:var(--bg-2);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:1px}
.lado .marca{padding:2px 6px 14px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.lado .marca img{width:32px;height:32px}
.grupo{font-size:11px;font-weight:600;letter-spacing:.6px;color:var(--muted);text-transform:uppercase;padding:14px 10px 5px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:var(--r-sm);border:0;background:none;color:var(--ink-2);font-weight:500;font-size:13px;text-align:left;position:relative}
.nav .ic{width:17px;height:17px;color:var(--muted)}
.nav:hover{background:var(--surface);color:var(--ink)}
.nav.on{background:var(--surface-2);color:var(--ink)}
.nav.on::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:2px;background:var(--marca)}
.nav.on .ic{color:var(--ink)}
.nav .bd{margin-left:auto;min-width:20px;height:18px;padding:0 6px;border-radius:9px;background:var(--crit);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center}
.lado .rodape{margin-top:auto;padding-top:12px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--surface-3);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.rodape .q{min-width:0;flex:1}
.rodape .q b{display:block;font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rodape .q small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{padding:0 24px 56px;min-width:0}
.topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 -24px 18px;padding:14px 24px;border-bottom:1px solid var(--border);background:var(--bg)}
.topo h1{margin:0;font-size:18px;font-weight:600}
.topo p{margin:2px 0 0;color:var(--muted);font-size:12px}
.topo .dir{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.faixa-demo{background:color-mix(in srgb,var(--warn) 9%,transparent);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:#ecd08f;font-size:12px;padding:7px 11px;border-radius:var(--r-sm);margin-bottom:14px}

/* ---------------- blocos ---------------- */
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.w{grid-column:span 6;min-width:0}
.w.metade{grid-column:span 3}.w.terco{grid-column:span 2}.w.doisTercos{grid-column:span 4}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);min-width:0;position:relative}
.card.cor{border-top:2px solid var(--wc)}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);flex-wrap:wrap;min-height:44px}
.card-t{font-size:13px;font-weight:600}
.card-s{font-size:12px;color:var(--muted)}
.card-h .dir{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.card-b{padding:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:row-reverse;justify-content:space-between;gap:10px;align-items:flex-start}
.kpi>div:last-child{min-width:0}
.kpi .k-ic{display:grid;place-items:center;flex:none;padding-top:1px;opacity:.9}
.kpi .k-ic .ic{width:17px;height:17px}
.kpi .k-l{font-size:12px;color:var(--ink-2);font-weight:500}
.kpi .k-v{font-size:22px;font-weight:600;line-height:1.25;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .k-h{font-size:12px;color:var(--muted);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--border-2);white-space:nowrap;position:sticky;top:0;background:var(--surface-2);z-index:1}
td{padding:7px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:nth-child(even) td{background:rgba(255,255,255,.012)}
tbody tr:hover td{background:rgba(255,255,255,.035)}
tr:last-child td{border-bottom:0}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl{overflow:auto;max-height:460px;border:1px solid var(--border);border-radius:var(--r-sm)}
.sel-c{width:34px;text-align:center}
.sel-c input{width:16px;height:16px;accent-color:var(--marca);cursor:pointer;margin:0;vertical-align:middle}
tr[data-cod]{cursor:pointer}
tbody tr.sel-on td,tbody tr.sel-on:hover td{background:rgba(194,35,29,.13)}
.sel-barra{position:sticky;bottom:0;z-index:3;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px;padding:10px 12px;background:var(--surface-2);border:1px solid var(--marca);border-radius:var(--r-sm)}
.sel-barra>span{margin-right:auto;font-size:13px}
.sel-so{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.sel-so input{accent-color:var(--marca)}
.selp-ov{position:fixed;inset:0;z-index:9999;background:rgba(8,8,10,.94);overflow:auto;padding:16px}
.selp-acoes{max-width:900px;margin:0 auto 10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:#fff;font-size:13px}
.selp-acoes>span{margin-right:auto;opacity:.85}
.selp-acoes label{display:flex;align-items:center;gap:6px;cursor:pointer}
.selp-acoes input{accent-color:var(--marca)}
.selp{max-width:900px;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-top:4px solid var(--marca);border-radius:var(--r-sm);padding:18px 20px;color:var(--ink)}
.selp-h{display:flex;align-items:center;gap:12px;padding-bottom:12px;margin-bottom:6px;border-bottom:1px solid var(--border)}
.selp-h img{width:44px;height:44px;border-radius:8px;object-fit:contain;background:#fff}
.selp-t{font-weight:700;font-size:15px;letter-spacing:.2px}
.selp-s{font-size:12px;color:var(--muted);margin-top:2px}
.selp table{width:100%;border-collapse:collapse;font-size:13px}
.selp th{text-align:left;font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);padding:9px 8px;border-bottom:1px solid var(--border)}
.selp td{padding:8px;border-bottom:1px solid var(--border)}
.selp .num{text-align:right;white-space:nowrap}
.selp tfoot td{border-bottom:0;padding-top:12px;color:var(--ink-2)}
.selp-ov.sem-valor .vv{display:none}
html.m-cel .selp{padding:12px}
html.m-cel .selp table{font-size:12px}
html.m-cel .selp td,html.m-cel .selp th{padding:6px 4px}
.vazio{padding:22px;text-align:center;color:var(--muted);font-size:13px}
.tag{display:inline-flex;align-items:center;gap:5px;padding:1px 7px;border-radius:var(--r-sm);font-size:11.5px;font-weight:500;background:color-mix(in srgb,var(--tg) 14%,transparent);color:var(--tg);white-space:nowrap}
.sem{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.hbar{margin-bottom:11px}
.hbar-h{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:4px}
.hbar-h span:last-child{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.hbar-tr{height:6px;border-radius:1px;background:var(--surface-3);overflow:hidden}
.hbar-tr i{display:block;height:100%}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--border-2);border-radius:var(--r-sm);padding:2px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 11px;border-radius:2px;font-size:12.5px;font-weight:500;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--surface-3);color:var(--ink)}
[data-mov=sai] [data-tipos] button.on,[data-mov=sai] [data-ok]{background:var(--crit);color:#fff;border-color:var(--crit)}
[data-mov=ent] [data-tipos] button.on,[data-mov=ent] [data-ok]{background:var(--good);color:#fff;border-color:var(--good)}
.mov-dica{font-size:12.5px;color:var(--ink-2);margin:-4px 0 12px}.mov-info{display:block;font-size:12px;color:var(--muted)}.mov-info.neg{color:var(--crit);font-weight:600}
.linha{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
.link-acao{display:inline-flex;align-items:center;gap:5px;margin-top:6px;color:var(--ink-2);font-size:12.5px;background:none;border:0;padding:3px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--border-2)}
.link-acao:hover{color:var(--ink);text-decoration-color:var(--ink-2)}
.link-acao .ic{width:14px;height:14px}
.caixa-novo{margin-top:10px;padding:12px;border:1px solid var(--border-2);border-left:2px solid var(--marca);border-radius:var(--r-sm);background:var(--bg)}
.caixa-novo .t{font-weight:600;font-size:13px;margin-bottom:8px}
.caixa-novo .t small{color:var(--muted);font-weight:400}
.toast{position:fixed;right:16px;bottom:16px;z-index:120;display:grid;gap:6px}
.toast div{background:#1c1d21;border:1px solid var(--border-2);border-left:3px solid var(--good);padding:10px 13px;border-radius:var(--r-sm);box-shadow:var(--shadow);font-size:13px;max-width:380px}
.toast div.mal{border-left-color:var(--crit)}
.sug{position:absolute;left:0;right:0;top:100%;margin-top:2px;background:#1c1d21;border:1px solid var(--border-2);border-radius:var(--r-sm);max-height:280px;overflow:auto;z-index:30;box-shadow:var(--shadow)}
.sug button{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 11px;border-bottom:1px solid var(--border);font-size:13px}
.sug button:hover,.sug button.on{background:var(--surface-3)}
.sug small{color:var(--muted)}
.carrinho{list-style:none;margin:10px 0;padding:0;border-top:1px solid var(--border)}
.carrinho li{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px}
.carrinho li span{flex:1;min-width:0}
.carrinho input{width:80px;text-align:right}
.novo-tag{font-size:10.5px;font-weight:600;letter-spacing:.4px;color:var(--marca-2);border:1px solid color-mix(in srgb,var(--marca) 50%,transparent);border-radius:2px;padding:0 4px}
.assin{position:relative;height:150px;margin:6px 0 4px;background:#fff;border:1px solid var(--border-2);border-radius:var(--r-sm);overflow:hidden}
.assin canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.assin span{position:absolute;left:14px;right:14px;bottom:26px;border-top:1px solid #ccc;pointer-events:none;font-size:11px;color:#999;padding-top:3px}
.assin-h{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
svg.ch{display:block;width:100%;height:auto}
svg.ch text{font:400 10px var(--sans);fill:var(--muted)}
.legenda{display:flex;gap:14px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--ink-2)}
.legenda i{display:inline-block;width:9px;height:9px;border-radius:1px;margin-right:5px;vertical-align:-1px}
.recado{font-size:14px;line-height:1.6;white-space:pre-wrap}
.burger{display:none}

/* ---------------- editor de telas ---------------- */
.ed{display:grid;grid-template-columns:360px minmax(0,1fr);gap:14px;align-items:start}
.ed-col{display:grid;gap:12px}
.tela-it{display:flex;align-items:center;gap:6px;padding:6px;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:6px;background:var(--surface-2)}
.tela-it.on{border-color:var(--marca);box-shadow:inset 2px 0 0 var(--marca)}
.tela-it input{height:30px;padding:4px 8px;background:transparent;border-color:transparent}
.tela-it input:focus{background:var(--bg)}
.ib{width:30px;height:30px;border-radius:var(--r-sm);border:1px solid var(--border);background:var(--surface);display:grid;place-items:center;flex:none;color:var(--ink-2)}
.ib:hover{color:var(--ink);border-color:var(--border-2)}
.ib svg{width:15px;height:15px}
.bloco{border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;margin-bottom:8px;background:var(--surface-2);display:grid;gap:8px}
.bloco.arrastando{opacity:.4}
.bloco.alvo{border-color:var(--ink-2);box-shadow:0 -2px 0 var(--ink-2)}
.bloco-h{display:flex;align-items:center;gap:8px}
.bloco-h .alca{cursor:grab;color:var(--muted);display:grid;place-items:center}
.bloco-h b{font-size:13px;font-weight:500;flex:1;min-width:0}
.bloco-h small{color:var(--muted);font-weight:400}
.bloco-o{display:grid;grid-template-columns:1fr 120px;gap:8px}
.bloco-o input,.bloco-o select{height:30px;padding:4px 8px;font-size:12.5px}
.cores{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cores button{width:20px;height:20px;border-radius:2px;border:2px solid transparent;background:var(--c)}
.cores button.on{border-color:#fff}
.catalogo{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.catalogo button{text-align:left;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:9px 10px;font-size:12.5px}
.catalogo button:hover{border-color:var(--ink-2)}
.catalogo button b{display:block;margin-bottom:2px;font-weight:500}
.catalogo button small{color:var(--muted)}
.previa{border:1px dashed var(--border-2);border-radius:var(--r);padding:14px;background:var(--bg)}
.previa-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.salvar-barra{position:sticky;bottom:12px;z-index:20;display:flex;gap:8px;align-items:center;justify-content:flex-end;padding:9px 12px;border-radius:var(--r);background:#1c1d21;border:1px solid var(--border-2);box-shadow:var(--shadow)}
.salvar-barra span{margin-right:auto;font-size:12.5px;color:var(--ink-2)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400;color:var(--ink-2);margin:0}
.chk input{width:16px;height:16px;accent-color:var(--marca)}

@media (max-width:1100px){.w.terco{grid-column:span 3}.w.doisTercos{grid-column:span 6}}
@media (max-width:1000px){.w.metade,.w.terco,.w.doisTercos{grid-column:span 6}.ed{grid-template-columns:1fr}}
@media (max-width:820px){
  #app{grid-template-columns:1fr}
  .lado{position:fixed;left:0;top:0;bottom:0;width:260px;z-index:50;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .lado.aberto{transform:none}
  .burger{display:inline-flex}
  main{padding:0 16px 56px}
  .topo{margin:0 -16px 14px;padding:12px 16px}
  .card-login{padding:22px}
}

/* ================================================================ MODO CELULAR */
.barra-cel,.veu{display:none}
.modo-tela{padding:10px 4px 4px;border-top:1px solid var(--border);margin-top:auto}
.modo-tela small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin:0 0 6px 4px}
.modo-tela .seg{display:grid;grid-template-columns:repeat(3,1fr);width:100%}
.modo-tela .seg button{padding:5px 2px;font-size:11.5px}
.lado .modo-tela+.rodape{margin-top:0}
html.m-cel #app{grid-template-columns:1fr}
html.m-cel .lado{position:fixed;left:0;top:0;bottom:0;width:min(84vw,300px);z-index:60;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow);padding-bottom:calc(16px + env(safe-area-inset-bottom))}
html.m-cel .lado.aberto{transform:none}
html.m-cel .veu{display:block;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .2s}
html.m-cel .lado.aberto~.veu{opacity:1;pointer-events:auto}
html.m-cel .nav{padding:11px 10px;font-size:14px}
html.m-cel .nav .ic{width:19px;height:19px}
html.m-cel main{width:100%;max-width:640px;margin:0 auto;padding:0 12px calc(84px + env(safe-area-inset-bottom))}
html.m-cel .burger{display:none}
/* cabeçalho fixo e compacto */
html.m-cel .topo{position:sticky;top:0;z-index:30;margin:0 -12px 12px;padding:calc(9px + env(safe-area-inset-top)) 12px 9px;flex-wrap:nowrap;gap:8px}
html.m-cel .topo>div:not(.dir){min-width:0;flex:1}
html.m-cel .topo h1{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.m-cel .topo p{font-size:11.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html.m-cel .topo .dir{margin-left:0;flex-wrap:nowrap;flex:none}
html.m-cel .topo .dir select{max-width:140px;height:38px!important}
html.m-cel .topo .btn[data-atualizar]{width:38px;height:38px;padding:0}
html.m-cel .topo .btn[data-atualizar] span{display:none}
html.m-cel .topo .btn[data-atualizar] .ic{width:18px;height:18px}
html.m-cel .faixa-demo{font-size:11.5px;margin-bottom:12px}
/* barra de baixo */
html.m-cel .barra-cel{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg-2);border-top:1px solid var(--border);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
.barra-cel button{position:relative;min-width:0;border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:3px;padding:6px 2px 4px;font-size:11px;font-weight:500}
.barra-cel button .ic{width:21px;height:21px}
.barra-cel button .t{max-width:100%;padding:0 2px;font-size:10.5px;line-height:1.15;text-align:center;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.barra-cel button.on{color:var(--ink)}
.barra-cel button.on::before{content:"";position:absolute;top:-4px;left:30%;right:30%;height:2px;background:var(--marca)}
.barra-cel button:active{background:var(--surface)}
.barra-cel .bd{position:absolute;top:3px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--crit);color:#fff;font-size:10px;font-weight:600;display:grid;place-items:center}
/* conteúdo */
html.m-cel .grid{gap:10px}
html.m-cel .w,html.m-cel .w.metade,html.m-cel .w.terco,html.m-cel .w.doisTercos{grid-column:span 6}
html.m-cel .card-h{padding:10px 12px}
html.m-cel .card-b{padding:12px}
html.m-cel .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
html.m-cel .kpi{padding:10px 12px}
html.m-cel .kpi .k-l{font-size:11.5px}
html.m-cel .kpi .k-v{font-size:19px;overflow-wrap:anywhere}
html.m-cel .kpi .k-h{font-size:11px}
/* tabelas viram fichas: título em cima, campos em 2 colunas (rótulo sobre o valor) */
html.m-cel .tbl{max-height:none!important;overflow:visible;border:0;border-radius:0}
html.m-cel .tbl table,html.m-cel .tbl tbody{display:block;width:100%}
html.m-cel .tbl thead{display:none}
html.m-cel .tbl tr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:9px 14px;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:8px}
html.m-cel .tbl tbody tr td,html.m-cel .tbl tbody tr:hover td{background:none}
html.m-cel .tbl td{display:block;min-width:0;padding:0;border:0;text-align:left!important;font-size:13.5px;line-height:1.35;overflow-wrap:anywhere}
html.m-cel .tbl td::before{content:attr(data-label);display:block;font-size:11px;font-weight:500;color:var(--muted);margin-bottom:2px;line-height:1.2}
html.m-cel .tbl td:first-child{grid-column:1/-1;font-size:14.5px;font-weight:600;padding-bottom:8px;border-bottom:1px solid var(--border)}
html.m-cel .tbl td:first-child::before{display:none}
html.m-cel .tbl td.larga{grid-column:1/-1}
html.m-cel .tbl td[data-label=""]{grid-column:1/-1;display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding-top:2px}
html.m-cel .tbl td[data-label=""]::before{display:none}
html.m-cel .tbl td[colspan]{grid-column:1/-1;text-align:center!important}
html.m-cel .tbl td[colspan]::before{display:none}
html.m-cel .tbl td input,html.m-cel .tbl td select{width:100%;min-height:40px}
html.m-cel .tbl td small,html.m-cel .tbl td .card-s{display:block;margin-top:1px}
html.m-cel .tbl td .tag{white-space:normal}
html.m-cel .kpis>.kpi:last-child:nth-child(odd){grid-column:1/-1}
html.m-cel .salvar-barra{flex-wrap:wrap;justify-content:stretch}
html.m-cel .salvar-barra span{flex-basis:100%}
html.m-cel .salvar-barra .btn{flex:1}
html.m-cel .tela-it select{width:96px!important;flex:none}
html.m-cel .seg{max-width:100%}
/* formulários bons para o dedo */
html.m-cel input,html.m-cel select,html.m-cel textarea{font-size:16px;min-height:44px}
html.m-cel input[type=checkbox],html.m-cel input[type=radio]{min-height:0;width:20px;height:20px}
html.m-cel .linha{grid-template-columns:1fr;gap:10px}
html.m-cel .btn{height:42px;font-size:14px}
html.m-cel .btn.sm{height:34px;font-size:12.5px}
html.m-cel .card-b .btn.pri,html.m-cel .card-b .btn.blue{width:100%;height:46px;font-size:15px}
html.m-cel .card-b .seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));width:100%}
html.m-cel .card-b .seg button{padding:10px 6px;font-size:13px}
html.m-cel .carrinho li{flex-wrap:wrap}
html.m-cel .carrinho li span{flex-basis:100%}
html.m-cel .carrinho input{flex:1;min-height:42px}
html.m-cel .assin{height:190px}
html.m-cel .sug button{padding:12px 10px}
html.m-cel .link-acao{font-size:13.5px;padding:8px 0}
/* avisos acima da barra */
html.m-cel .toast{left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom))}
html.m-cel .toast div{max-width:none;font-size:13.5px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>

const P={};
function prep(){
  const D=DADOS||{};
  P.est=(D.estoque||[]).map(r=>({...r,q:int(r.quantidade),min:int(r.estoque_minimo)}));
  P.mov=(D.movimentacoes||[]).map(r=>({...r,d:pdate(r.data),q:int(r.quantidade),tipo:N(r.tipo)})).filter(r=>r.d).sort((a,b)=>+b.d-+a.d||String(b.hora).localeCompare(String(a.hora)));
  P.fb=(D.fechamento_bases||[]).map(r=>({...r,d:pdate(r.data),q:int(r.quantidade),eq:int(r.equipes),k:N(r.base)})).filter(r=>r.d);
  P.fp=(D.fechamento_producao||[]).map(r=>({...r,d:pdate(r.data),q:int(r.quantidade),eq:int(r.equipes),k:N(r.base)})).filter(r=>r.d);
  const datas=[...P.fb,...P.fp].map(r=>+r.d);
  P.ref=datas.length?new Date(Math.max(...datas)):new Date();
  const hj=pdate((D.agora||{}).data)||new Date();hj.setHours(0,0,0,0);P.hoje=hj;
  P.bases=[...new Set([...P.fb,...P.fp].map(r=>r.k).concat((D.metas_bases||[]).map(m=>N(m.base))))].filter(Boolean).sort();
  P.equipes=[...new Set([...(D.equipes||[]).map(e=>N(e.codigo)),...Object.keys(D.saldo_equipes||{})])].filter(Boolean).sort();
  P.saldo=D.saldo_equipes||{};
  P.func=(D.funcionarios||[]).map(f=>({...f,mat:N(f.matricula)})).sort((a,b)=>String(a.nome).localeCompare(b.nome));
  P.epiCad=Object.fromEntries((D.epi_cadastro||[]).map(x=>[N(x.codigo),x]));
  P.ent=(D.entregas_funcionario||[]).map(e=>({...e,d:pdate(e.data),v:pdate(e.vencimento),vca:pdate(e.validade_ca),q:int(e.quantidade),st:N(e.status)||'EM USO'}));
  P.inv=(D.inventarios||[]);
  P.mont=(D.producao_montagem||[]).map(r=>({...r,d:pdate(r.data),q:int(r.quantidade),m:String(r.montador||'').trim().toUpperCase()})).filter(r=>r.d);
  const lmm=(CFG().materiais_montagem||[]).map(N);
  P.matMont=(D.materiais_montagem||P.est.filter(i=>N(i.categoria).includes('MONTAGEM')||lmm.includes(N(i.codigo)))).map(r=>({codigo:r.codigo,material:r.material,unidade:r.unidade,q:int(r.quantidade)})).sort((a,b)=>String(a.material).localeCompare(String(b.material),'pt-BR'));
  P.baixas=(D.baixas_montagem?D.baixas_montagem.map(r=>({...r,d:pdate(r.data),q:int(r.quantidade),tipo:'MONTAGEM'})).filter(r=>r.d):P.mov.filter(m=>m.tipo==='MONTAGEM')).sort((a,b)=>+b.d-+a.d||String(b.hora).localeCompare(String(a.hora)));
  P.montadores=[...new Set([...P.func.filter(f=>/MONTA/.test(N(f.funcao))&&N(f.situacao)!=='INATIVO').map(f=>f.nome),...P.mont.map(r=>r.m)])].filter(Boolean).sort();
}

const reaisC=v=>(+v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const flo=v=>{const t=String(v??'').replace(/[R$\s]/g,'');if(!t)return 0;const n=t.includes(',')?parseFloat(t.replace(/\./g,'').replace(',','.')):parseFloat(t);return isNaN(n)?0:n};
const diasAte=d=>d?Math.round((d-P.hoje)/864e5):null;
const statusVenc=d=>{const x=diasAte(d);if(x==null)return{t:'sem data',c:'var(--muted)',k:0};if(x<0)return{t:'vencido há '+(-x)+'d',c:'var(--crit)',k:2};if(x<=(CFG().dias_aviso||30))return{t:'vence em '+x+'d',c:'var(--warn)',k:1};return{t:'ok · '+fdate(d),c:'var(--good)',k:0}};

function diasUteis(y,m,ate){const fim=ate==null?new Date(y,m+1,0).getDate():ate;let n=0;for(let d=1;d<=fim;d++)if(ehUtil(new Date(y,m,d)))n++;return n}

function montarNav(){
  const u=SESS.usuario,nav=$('#nav');let h='';
  const item=(id,nome,ic,bd)=>`<button class="nav${TELA===id?' on':''}" data-tela="${esc(id)}">${ico(ic)}<span>${esc(nome)}</span>${bd?`<span class="bd">${bd}</span>`:''}</button>`;
  if(u.setor==='master'){
    h+=item('m_geral','Visão geral','home');
    SETORES_UI.filter(s=>!OCULTOS_SETORES.includes(s)).forEach(s=>{h+=`<div class="grupo">${SETOR_NOME[s]}</div>`;telasDo(s).filter(t=>!oculta(s+'::'+t.id)).forEach(t=>h+=item(s+'::'+t.id,t.nome,t.icone,badge(t)))});
    h+=`<div class="grupo">Administração</div>`+item('m_editor','Editor de telas','edit')+item('m_acessos','Acessos','key');
  }else telasDo(u.setor).filter(t=>!OCULTAS_TELAS.includes(u.setor+'::'+t.id)).forEach(t=>h+=item(u.setor+'::'+t.id,t.nome,t.icone,badge(t)));
  nav.innerHTML=h;
  $$('.nav',nav).forEach(b=>b.onclick=()=>{abrir(b.dataset.tela);$('#lado').classList.remove('aberto')});
  montarBarraCel();
}
/* ---------------------------------------------------------------- modo celular / computador */
const MQ_CEL=window.matchMedia('(max-width: 820px)');
function modoTela(){try{return localStorage.getItem('fx_modo_tela')||'auto'}catch(e){return 'auto'}}
function aplicarModo(){
  const m=modoTela(),cel=m==='cel'||(m==='auto'&&MQ_CEL.matches);
  document.documentElement.classList.toggle('m-cel',cel);
  const vp=document.querySelector('meta[name=viewport]');
  if(vp)vp.content=(m==='pc'&&Math.min(screen.width,screen.height)<820)?'width=1280':'width=device-width,initial-scale=1,viewport-fit=cover';
  $$('#modoTela [data-m]').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
}
if(MQ_CEL.addEventListener)MQ_CEL.addEventListener('change',aplicarModo);else MQ_CEL.addListener(aplicarModo);
function montarBarraCel(){
  const bar=$('#barraCel');if(!bar||!SESS)return;
  const itens=$$('#nav .nav').map(b=>({id:b.dataset.tela,nome:b.querySelector('span').textContent,ic:b.querySelector('svg').outerHTML,bd:(b.querySelector('.bd')||{}).textContent||''}));
  let mostra=itens.slice(0,4);
  if(itens.length>4){mostra=itens.slice(0,3);const at=itens.find(i=>i.id===TELA);if(at&&!mostra.includes(at))mostra.push(at);else mostra.push(itens[3])}
  const menu=itens.length>mostra.length||true;
  bar.innerHTML=mostra.map(i=>`<button type="button" class="${i.id===TELA?'on':''}" data-tela="${esc(i.id)}">${i.ic}<span class="t">${esc(i.nome)}</span>${i.bd?`<span class="bd">${esc(i.bd)}</span>`:''}</button>`).join('')+
    (menu?`<button type="button" data-menu>${ico('menu')}<span class="t">Menu</span></button>`:'');
  $$('[data-tela]',bar).forEach(b=>b.onclick=()=>abrir(b.dataset.tela));
  const mb=$('[data-menu]',bar);if(mb)mb.onclick=()=>$('#lado').classList.add('aberto');
}
/* lista de itens marcados no estoque, pronta para print */
function verSelecaoEstoque(itens){
  if(!itens.length)return;
  const logo=($('.marca img')||$('.tile img')||{}).src||'';
  const d=new Date(),dt=d.toLocaleDateString('pt-BR')+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const comValor=itens.some(i=>flo(i.valor_unitario));
  const tot=itens.reduce((t,i)=>t+Math.max(0,i.q)*flo(i.valor_unitario),0);
  const ov=document.createElement('div');ov.className='selp-ov';
  ov.innerHTML=`<div class="selp-acoes"><span>Tire o print da área abaixo (Win + Shift + S no computador)</span><label><input type="checkbox" data-pv${comValor?' checked':''}> mostrar valores</label><button class="btn" type="button" data-pf>Fechar</button></div>
  <div class="selp">
    <div class="selp-h">${logo?`<img src="${logo}" alt="Fixar">`:''}<div><div class="selp-t">FIXAR SOLUÇÕES · Lista de materiais</div><div class="selp-s">Almoxarifado · ${esc(dt)} · ${itens.length} ${itens.length===1?'item':'itens'}</div></div></div>
    <table><thead><tr><th>#</th><th>Código</th><th>Material</th><th>Categoria</th><th class="num">Saldo</th><th class="vv num">Valor unit.</th><th class="vv num">Valor total</th><th>Local</th></tr></thead>
    <tbody>${itens.map((i,k)=>`<tr><td>${k+1}</td><td>${esc(i.codigo)}</td><td>${esc(i.material)}</td><td>${esc(i.categoria)}</td><td class="num">${num(i.q)} ${esc(i.unidade)}</td><td class="vv num">${flo(i.valor_unitario)?reaisC(flo(i.valor_unitario)):'—'}</td><td class="vv num">${flo(i.valor_unitario)?reais(Math.max(0,i.q)*flo(i.valor_unitario)):'—'}</td><td>${esc([i.prateleira,i.posicao].filter(Boolean).join('-'))}</td></tr>`).join('')}</tbody>
    <tfoot class="vv"><tr><td colspan="6">Total em estoque dos itens marcados</td><td class="num"><b>${reais(tot)}</b></td><td></td></tr></tfoot></table>
  </div>`;
  document.body.appendChild(ov);
  const pv=$('[data-pv]',ov),apl=()=>ov.classList.toggle('sem-valor',!pv.checked);pv.onchange=apl;apl();
  const fechar=()=>{ov.remove();document.removeEventListener('keydown',esc_)};const esc_=e=>{if(e.key==='Escape')fechar()};
  $('[data-pf]',ov).onclick=fechar;ov.onclick=e=>{if(e.target===ov)fechar()};document.addEventListener('keydown',esc_);
}
/* rótulos das tabelas para virarem cartões no celular */
const LARGAS=/^(MATERIAL|FUNCIONARIO|NOME|CLIENTE|OBSERVACAO|OBS\.?|NOTA|ITENS|MOTIVO|DESCRICAO|ENDERECO)$/;
function rotularTabelas(raiz){
  $$('.tbl table',raiz).forEach(t=>{const hs=$$('thead th',t).map(th=>th.textContent.trim());if(!hs.length)return;
    $$('tbody tr',t).forEach(tr=>{let c=0;[...tr.children].forEach((td,k)=>{if(!td.hasAttribute('data-label'))td.setAttribute('data-label',hs[c]||'');const l=N(td.getAttribute('data-label'));if(k&&(LARGAS.test(l)||td.textContent.trim().length>26))td.classList.add('larga');c+=+(td.getAttribute('colspan')||1)})})});
}
let __rot=0;new MutationObserver(()=>{cancelAnimationFrame(__rot);__rot=requestAnimationFrame(()=>rotularTabelas(document))}).observe(document.body,{childList:true,subtree:true});
function abrirApp(){
  const u=SESS.usuario;$('#app').classList.remove('hide');
  $('#uNome').textContent=u.nome||u.usuario;$('#uAv').textContent=String(u.nome||u.usuario).trim().slice(0,1).toUpperCase();
  $('#uSetor').textContent=SETOR_NOME[u.setor]+(u.base?' · '+u.base:'');
  const ult=store.get('ultima_tela');
  const primeira=u.setor==='master'?'m_geral':u.setor+'::'+((telasDo(u.setor)[0]||{}).id||'');
  abrir(ult&&(u.setor==='master'?!oculta(ult):String(ult).startsWith(u.setor+'::')&&!OCULTAS_TELAS.includes(ult))?ult:primeira);
  setTimeout(()=>{if(['almoxarifado','master'].includes(u.setor)&&!estoqueMudo()&&emFalta().length)toast(''+emFalta().length+' item(ns) do estoque abaixo do mínimo — veja em Alertas.',true);
    if((u.setor==='seguranca'||(u.setor==='master'&&!OCULTOS_SETORES.includes('seguranca')))&&alertasSST())toast(''+alertasSST()+' EPI/CA vencido ou vencendo — veja no Painel SST.',true)},900);
}
function abrir(id){
  TELA=id;store.set('ultima_tela',id);montarNav();window.scrollTo(0,0);
  const main=$('#main');
  if(id==='m_geral')return renderGeral(main);
  if(id==='m_editor')return renderEditor(main);
  if(id==='m_acessos')return renderAcessos(main);
  const [setor,tid]=id.split('::');const t=telasDo(setor).find(x=>x.id===tid)||telasDo(setor)[0];
  if(!t){main.innerHTML='<div class="vazio">Nenhuma tela configurada para este setor.</div>';return}
  renderTela(main,setor,t);
}
function topo(titulo,sub,dir){
  return `<div class="topo"><button class="btn ghost burger" onclick="document.getElementById('lado').classList.add('aberto')">${ico('menu')}</button><div><h1>${esc(titulo)}</h1>${sub?`<p>${sub}</p>`:''}</div><div class="dir">${dir||''}<button class="btn sm" data-atualizar title="Buscar dados novos">${ico('refresh')}<span>Atualizar</span></button></div></div>`+(DEMO?'<div class="faixa-demo">Modo demonstração: os dados são de exemplo e nada é gravado na planilha.</div>':'');
}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-atualizar]');if(!b)return;b.disabled=true;try{await carregarDados();abrir(TELA);toast('Dados atualizados.')}catch(err){toast(err.message,true)}finally{b.disabled=false}});

/* ---------------------------------------------------------------- render de tela */
function ctxDe(setor){
  const u=SESS.usuario;
  return{setor,base:setor==='gerente_base'?(u.setor==='master'?BASE_MASTER||P.bases[0]||'':u.base):''};
}
function renderTela(main,setor,t){
  const c=ctxDe(setor);
  let dir='';
  if(setor==='gerente_base'&&SESS.usuario.setor==='master')dir=`<select id="selBase" style="width:auto;height:34px;padding:4px 10px">${P.bases.map(b=>`<option${b===c.base?' selected':''}>${esc(b)}</option>`).join('')}</select>`;
  const sub=setor==='gerente_base'?'Base '+esc(c.base):SETOR_NOME[setor]+' · '+hojeTxt();
  main.innerHTML=topo(t.nome,sub,dir)+`<div class="grid" id="grade"></div>`;
  montarWidgets($('#grade'),t.widgets,c);
  const sb=$('#selBase');if(sb)sb.onchange=()=>{BASE_MASTER=sb.value;abrir(TELA)};
}
function montarWidgets(alvo,widgets,c){
  alvo.innerHTML='';
  (widgets||[]).filter(w=>w.visivel!==false).forEach((w,i)=>{
    const def=CAT[w.tipo];if(!def)return;
    const el=document.createElement('div');el.className='w '+(w.largura&&w.largura!=='cheia'?w.largura:'');
    if(w.cor)el.style.setProperty('--wc',w.cor);
    alvo.appendChild(el);
    try{def.render(el,w,c)}catch(err){console.error(err);el.innerHTML=cardH(w,def,'<div class="vazio">Não foi possível montar este bloco.</div>')}
  });
}

  meu_mes:{nome:'Meu mês (montador)',setores:['montagem'],desc:'Produção do montador: hoje, mês, meta do mês e quanto falta',render(el,w){

        <div class="hbar"><div class="hbar-h"><span>Progresso do mês</span><span style="color:${adiant>=0?'var(--good)':'var(--warn)'}">${adiant>=0?'▲ '+num(adiant)+' à frente do ritmo':'▼ '+num(-adiant)+' atrás do ritmo'}</span></div><div class="hbar-tr" style="height:12px"><i style="width:${Math.max(1,pc)}%;background:${pc>=100?'var(--good)':'var(--s1)'}"></i></div></div>

    el.innerHTML=cardH(w,CAT.meu_mes,(souMontador?'':`<select data-q style="margin-bottom:12px">${P.montadores.map(m=>`<option${m===quem?' selected':''}>${esc(m)}</option>`).join('')}</select>`)+'<div data-c></div>');

/* ---------------------------------------------------------------- assinatura na tela */
function padAssinatura(cv){
  const ctx=cv.getContext('2d');let des=false,tem=false,ult=null;
  const ajusta=()=>{const r=cv.getBoundingClientRect(),d=window.devicePixelRatio||1;cv.width=Math.max(1,r.width*d);cv.height=Math.max(1,r.height*d);ctx.setTransform(d,0,0,d,0,0);ctx.lineWidth=2.4;ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle=ctx.fillStyle='#111';tem=false};
  const pt=e=>{const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};
  requestAnimationFrame(ajusta);
  cv.onpointerdown=e=>{const r=cv.getBoundingClientRect();if(!tem&&Math.abs(cv.width-r.width*(window.devicePixelRatio||1))>2)ajusta();des=true;ult=pt(e);try{cv.setPointerCapture(e.pointerId)}catch(_){}ctx.beginPath();ctx.arc(ult.x,ult.y,1.2,0,7);ctx.fill();tem=true;e.preventDefault()};
  cv.onpointermove=e=>{if(!des)return;const q=pt(e);ctx.beginPath();ctx.moveTo(ult.x,ult.y);ctx.lineTo(q.x,q.y);ctx.stroke();ult=q};
  cv.onpointerup=cv.onpointercancel=cv.onpointerleave=()=>{des=false};
  return{limpar:ajusta,vazia:()=>!tem,imagem(){const W=480,k=W/cv.width,c=document.createElement('canvas');c.width=W;c.height=Math.max(1,Math.round(cv.height*k));const x=c.getContext('2d');x.drawImage(cv,0,0,c.width,c.height);let u=c.toDataURL('image/png');
    if(u.length>45000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.6)}return u}};
}

/* ---------------------------------------------------------------- ficha de EPI (imprimir / PDF) */
async function fichaEPI(mat){
  const w=window.open('','_blank');
  if(!w){toast('O navegador bloqueou a janela da ficha. Libere pop-ups para este site.',true);return}
  w.document.write('<p style="font:14px Arial,sans-serif;padding:24px">Gerando a ficha de EPI…</p>');
  try{const r=await api('ficha_epi',{matricula:mat});w.document.open();w.document.write(htmlFicha(r));w.document.close()}
  catch(err){w.close();toast(err.message,true)}
}

  const sit=e=>{const s=N(e.status)||'EM USO';return s==='EM USO'?'Em uso':(s==='DEVOLVIDO'?'Devolvido':'Baixado')+(e.devolvido_em?' em '+esc(e.devolvido_em):'')};
  const linhas=l.map(e=>`<tr><td>${esc(e.data)}</td><td class="n">${esc(e.quantidade)}</td><td><b>${esc(e.material)}</b><br><small>${esc(e.codigo_material)} · ${esc(e.categoria||'')}</small></td><td>${esc(e.ca||'—')}</td><td>${esc(e.vencimento||'—')}</td><td>${sit(e)}</td><td>${esc(e.responsavel||'')}</td><td class="ass">${e.assinatura_id&&r.assinaturas[e.assinatura_id]?`<img src="${r.assinaturas[e.assinatura_id]}" alt="assinatura">`:'<small>sem assinatura digital</small>'}</td></tr>`).join('');
  return `<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>Ficha de EPI - ${esc(f.nome)}</title><style>
@page{size:A4 landscape;margin:10mm}*{box-sizing:border-box}

.barra button{font:600 13px Arial;padding:8px 14px;border:0;border-radius:6px;background:${cor};color:#fff;cursor:pointer}
.top{display:flex;align-items:center;gap:14px;border-bottom:3px solid ${cor};padding-bottom:10px}
.top img{height:52px;border-radius:8px}.top h1{font-size:16px;margin:0}.top p{margin:2px 0 0;color:#555}
.dados{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 18px;margin:12px 0}.dados b{display:inline-block;min-width:74px;color:#555;font-weight:600}
.termo{border:1px solid #999;padding:8px 10px;text-align:justify;font-size:10.5px}
table{width:100%;border-collapse:collapse;margin-top:12px}th,td{border:1px solid #999;padding:4px 6px;text-align:left;vertical-align:middle}
th{background:#eee;font-size:9.5px;text-transform:uppercase;letter-spacing:.3px}td.n{text-align:right}td small{color:#666}
td.ass{width:170px;text-align:center}td.ass img{height:46px;max-width:170px}
.fim{display:flex;gap:50px;margin-top:46px}.fim div{flex:1;border-top:1px solid #111;text-align:center;padding-top:4px}
.rod{margin-top:16px;color:#777;font-size:9.5px}tr{page-break-inside:avoid}@media print{.barra{display:none}body{padding:0}}
</style></head><body>
<div class="barra"><button onclick="print()">Imprimir / Salvar em PDF</button><span>Na janela que abrir, escolha <b>Salvar como PDF</b> como destino.</span></div>
<div class="top">${logo?`<img src="${logo}" alt="">`:''}<div><h1>FICHA DE CONTROLE DE ENTREGA DE EPI, EPC E FERRAMENTAS</h1><p>${esc(r.empresa)} · NR-6 (Equipamento de Proteção Individual)</p></div></div>
<div class="dados"><div><b>Funcionário</b> ${esc(f.nome)}</div><div><b>Matrícula</b> ${esc(f.matricula)}</div><div><b>Função</b> ${esc(f.funcao||'—')}</div><div><b>Equipe</b> ${esc(f.equipe||'—')}</div><div><b>Base</b> ${esc(f.base||'—')}</div><div><b>Admissão</b> ${esc(f.admissao||'—')}</div></div>
<div class="termo">Declaro que recebi de <b>${esc(r.empresa)}</b>, gratuitamente, os equipamentos relacionados abaixo, novos ou em perfeito estado, e que fui orientado(a) sobre o uso correto, a guarda e a conservação de cada um, conforme a NR-6. Comprometo-me a usá-los apenas para a finalidade a que se destinam, a comunicar qualquer dano ou alteração que os torne impróprios para uso e a devolvê-los quando solicitado ou no meu desligamento. Estou ciente de que a recusa injustificada em usar o EPI fornecido constitui ato faltoso (CLT, art. 158).</div>
<table><thead><tr><th>Entrega</th><th>Qtd</th><th>Material</th><th>CA</th><th>Vencimento</th><th>Situação</th><th>Entregue por</th><th>Assinatura do funcionário</th></tr></thead><tbody>${linhas||'<tr><td colspan="8" style="text-align:center;padding:14px">Nenhuma entrega registrada.</td></tr>'}</tbody></table>

<div class="rod">Emitida em ${esc(r.emitido.data)} às ${esc(r.emitido.hora)} por ${esc(r.por)} · ${l.length} registro(s)</div>
<script>window.onload=function(){setTimeout(function(){print()},500)}<\/script></body></html>`;

/* ---------------------------------------------------------------- acessos (master) */
async function renderAcessos(main){
  main.innerHTML=topo('Acessos','Quem entra no sistema e em qual setor. Cada pessoa só vê as telas do próprio setor.')+'<div class="vazio">Carregando…</div>';
  let lista=[];try{lista=(await api('usuarios')).usuarios}catch(err){toast(err.message,true)}
  const form=(u={})=>`<section class="card"><div class="card-h"><span class="card-t">${u.usuario?'Editar '+esc(u.usuario):'Novo acesso'}</span></div><div class="card-b"><form data-f>
    <div class="linha"><div><label>Usuário (login)</label><input name="usuario" value="${esc(u.usuario||'')}" ${u.usuario?'readonly':''} placeholder="ex.: joao.almox" required></div><div><label>Nome</label><input name="nome" value="${esc(u.nome||'')}" placeholder="Nome que aparece na saudação" required></div></div>
    <div class="linha"><div><label>Setor</label><select name="setor">${[...SETORES_UI,'master'].map(s=>`<option value="${s}"${u.setor===s?' selected':''}>${SETOR_NOME[s]}</option>`).join('')}</select></div><div><label>Base</label><select name="base"><option value="">— nenhuma (vê todas) —</option>${[...new Set([...P.bases,N(u.base)].filter(Boolean))].sort().map(b=>`<option${N(u.base)===b?' selected':''}>${esc(b)}</option>`).join('')}</select><div style="font-size:11px;color:var(--muted);margin-top:3px" data-bw>Gerente de base precisa de uma base. Nos outros setores, a base separa os lançamentos de cada unidade.</div></div></div>
    <div class="linha"><div><label>${u.usuario?'Nova senha (deixe vazio para manter)':'Senha'}</label><input name="senha" type="text" autocomplete="off" ${u.usuario?'':'required'}></div><div style="align-self:end"><label class="chk"><input type="checkbox" name="ativo" ${u.ativo==='NAO'?'':'checked'}> Acesso ativo</label></div></div>
    <div style="display:flex;gap:8px;justify-content:flex-end">${u.usuario?'<button type="button" class="btn" data-novo>Cancelar</button>':''}<button class="btn pri">Salvar acesso</button></div></form></div></section>`;
  const desenha=(u)=>{
    main.innerHTML=topo('Acessos','Quem entra no sistema e em qual setor. Cada pessoa só vê as telas do próprio setor.')+`<div class="grid"><div class="w doisTercos"><section class="card"><div class="card-h"><span class="card-t">Pessoas com acesso</span><span class="card-s">${lista.length}</span></div><div class="card-b"><div class="tbl"><table><thead><tr><th>Usuário</th><th>Nome</th><th>Setor</th><th>Base</th><th>Situação</th><th>Último acesso</th><th></th></tr></thead><tbody>${lista.map((x,i)=>`<tr><td><b>${esc(x.usuario)}</b></td><td>${esc(x.nome)}</td><td>${tag(SETOR_NOME[x.setor]||x.setor,SETOR_COR[x.setor]||'var(--muted)')}</td><td>${esc(x.base||'—')}</td><td>${x.ativo==='NAO'?tag('bloqueado','var(--crit)'):tag('ativo','var(--good)')}</td><td>${esc(x.ultimo_acesso||'—')}</td><td style="white-space:nowrap"><button class="btn sm" data-ed="${i}">Editar</button>${x.setor==='master'?'':` <button class="btn sm" data-qr="${i}" title="QR de acesso rápido">${x.qr?'QR ativo':'QR'}</button>`}</td></tr>`).join('')}</tbody></table></div></div></section></div><div class="w terco">${form(u)}</div></div>`;
    const f=$('[data-f]',main);
    $$('[data-ed]',main).forEach(b=>b.onclick=()=>desenha(lista[b.dataset.ed]));
    $$('[data-qr]',main).forEach(b=>b.onclick=()=>painelQR(f.closest('.w'),lista[b.dataset.qr],async()=>{lista=(await api('usuarios')).usuarios;desenha()}));const nv=$('[data-novo]',main);if(nv)nv.onclick=()=>desenha();
    f.onsubmit=async e=>{e.preventDefault();const d={usuario:f.usuario.value.trim().toLowerCase(),nome:f.nome.value.trim(),setor:f.setor.value,base:f.base.value,senha:f.senha.value,ativo:f.ativo.checked};
      try{await api('usuario_salvar',{dados:d});toast('Acesso salvo: '+d.usuario);lista=(await api('usuarios')).usuarios;desenha()}catch(err){toast(err.message,true)}};
  };
  desenha();
}

/* ---------------------------------------------------------------- QR de acesso rápido */
function carregaQR(){return window.qrcode?Promise.resolve(window.qrcode):new Promise((ok,er)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=()=>ok(window.qrcode);s.onerror=()=>er(new Error('Não deu para carregar o gerador de QR. Confira a internet.'));document.head.appendChild(s)})}
async function svgQR(txt,cel){const q=(await carregaQR())(0,'M');q.addData(txt);q.make();return q.createSvgTag({cellSize:cel||6,margin:2,scalable:true})}
function painelQR(col,x,depois){
  const nome=esc(x.nome||x.usuario),setor=esc(SETOR_NOME[x.setor]||x.setor);
  const base=`<section class="card"><div class="card-h"><span class="card-t">QR de acesso rápido</span><span class="card-s">${nome}</span></div><div class="card-b">
    <div style="font-size:13px;color:var(--ink-2);line-height:1.5">Quem escanear este QR entra como <b>${nome}</b> (${setor}) <b>sem senha</b> e fica conectado por 30 dias naquele aparelho. Tudo o que fizer fica registrado no nome de ${nome}.</div>
    <div style="font-size:12px;color:var(--warn);margin:10px 0">Se o QR vazar, clique em Desativar QR: os QRs impressos param de funcionar na hora.</div>
    <div data-qrarea>${x.qr?`<div style="font-size:12px;color:var(--muted);margin-bottom:10px">QR ativo desde ${esc(x.qr)}. Por segurança o QR só aparece na hora em que é gerado; para imprimir de novo, gere um novo (o antigo para de funcionar).</div>`:''}</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px"><button class="btn pri" data-qrnovo>${x.qr?'Gerar novo QR':'Gerar QR'}</button>${x.qr?'<button class="btn" data-qrdel>Desativar QR</button>':''}<button class="btn" data-qrvolta>Voltar</button></div></div></section>`;
  col.innerHTML=base;
  $('[data-qrvolta]',col).onclick=()=>depois();
  if($('[data-qrdel]',col))$('[data-qrdel]',col).onclick=async e=>{e.currentTarget.disabled=true;try{await api('qr_remover',{usuario:x.usuario});toast('QR desativado: os QRs impressos de '+(x.nome||x.usuario)+' não entram mais.');await depois()}catch(err){toast(err.message,true);e.currentTarget.disabled=false}};
  $('[data-qrnovo]',col).onclick=async e=>{const b=e.currentTarget;b.disabled=true;
    try{const r=await api('qr_criar',{usuario:x.usuario});const link=location.origin+location.pathname+'?acesso='+r.chave;const svg=await svgQR(link,6);
      $('[data-qrarea]',col).innerHTML=`<div style="background:#fff;border-radius:10px;padding:12px;width:220px;margin:4px 0 10px">${svg}</div><div style="font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:10px">${esc(link)}</div><button class="btn" data-qrprint>Imprimir cartaz</button>`;
      $('[data-qrprint]',col).onclick=()=>cartazQR(r.nome,svg);
      b.textContent='Gerar novo QR';b.disabled=false;x.qr='agora';toast('QR gerado. Imprima o cartaz agora: ele não aparece de novo.')}
    catch(err){toast(err.message,true);b.disabled=false}};
}

  @page{size:A4;margin:14mm}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#1a1a19}

  .cap{text-align:center;font-size:15px;color:#4a4945;margin-bottom:28px}ol{font-size:18px;line-height:1.6;padding-left:26px;margin:0}ol b{font-weight:700}

  <div class="faixa"></div><div class="top">${logo?`<img src="${logo}">`:''}<div><b>FIXAR SOLUÇÕES</b><span>Central de Operações</span></div></div>

  <div class="qr">${svg}</div><div class="cap">Escaneie com a câmera do celular para entrar no Fixar Central<br><b>acesso rápido: ${esc(nome)}</b></div>
